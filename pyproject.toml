[project]
name = "pet-memorial-vet-qa"
version = "0.1.0"
description = "반려견 추모공간 - 근처 동물병원 Q&A 챗봇 (LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "fastapi[standard]>=0.139.2",
    "uvicorn>=0.50.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rapidfuzz>=3.14.5",
    "pyproj>=3.7.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "timm>=1.0.28",
    "pillow>=12.3.0",
    "boto3>=1.43.75",
    "huggingface-hub>=1.28.0",
    "google-genai>=2.19.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
